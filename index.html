<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b5ccc">
    <meta name="description" content="BORA TREINAR — seu treino organizado de forma simples.">
    <title>BORA TREINAR</title>
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/responsive.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button
          class="icon-button topbar-menu-button"
          id="sidebar-toggle"
          type="button"
          aria-label="Abrir menu"
          aria-expanded="false"
        >
          <span aria-hidden="true">☰</span>
        </button>

        <a class="brand" href="#/inicio" aria-label="Ir para o início">
          <span class="brand-mark" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" focusable="false"><path d="M6 9v6M18 9v6M3 11v2M21 11v2M6 12h12M8 7v10M16 7v10" /></svg></span>
          <span class="brand-name">BORA TREINAR</span>
        </a>

        <div class="topbar-search" role="search">
          <span class="search-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" focusable="false"><circle cx="10.8" cy="10.8" r="6.3" /><path d="m16 16 4.5 4.5" /></svg></span>
          <label class="sr-only" for="global-search">Pesquisar</label>
          <input id="global-search" type="search" placeholder="Pesquisar treinos e exercícios" autocomplete="off" aria-controls="search-results" aria-expanded="false">
          <button id="clear-search" class="clear-search" type="button" data-action="clear-search" aria-label="Limpar pesquisa" hidden>×</button>
          <div id="search-results" class="search-results" role="listbox" aria-label="Resultados da pesquisa"></div>
        </div>

        <div class="topbar-actions">
          <a class="topbar-action" href="#/configuracoes" aria-label="Abrir configurações" title="Configurações"><svg class="ui-icon" viewBox="0 0 24 24" focusable="false"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" /><path d="m19 13 .1-1-.1-1 2-1.5-2-3.5-2.4 1a8 8 0 0 0-1.7-1L14.5 3h-5L9 6a8 8 0 0 0-1.7 1l-2.4-1-2 3.5L5 11a8 8 0 0 0 0 2l-2.1 1.5 2 3.5 2.4-1a8 8 0 0 0 1.7-1l.5 3h5l.5-3a8 8 0 0 0 1.7-1l2.4 1 2-3.5L19 13Z" /></svg></a>
          <span class="topbar-divider" aria-hidden="true"></span>
          <a id="profile-chip" class="profile-chip" href="#/configuracoes" aria-label="Abrir perfil">V</a>
        </div>
      </header>

      <div class="workspace">
        <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

        <aside id="sidebar" class="sidebar" aria-label="Navegação principal">
          <div class="sidebar-scroll">
            <nav class="main-navigation" aria-label="Seções">
              <a class="nav-item" href="#/inicio" data-route="inicio">
                <span class="nav-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" focusable="false"><path d="m4 11 8-7 8 7v8H4zM9 19v-5h6v5" /></svg></span>
                <span>Início</span>
              </a>
              <a class="nav-item" href="#/treino-do-dia" data-route="treino-do-dia">
                <span class="nav-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" focusable="false"><path d="m5 12 4 4L19 6" /></svg></span>
                <span>Treino do dia</span>
              </a>
              <a class="nav-item" href="#/treinos" data-route="treinos">
                <span class="nav-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" focusable="false"><path d="M5 5h14v14H5zM9 9h6M9 13h6M9 17h4" /></svg></span>
                <span>Meus treinos</span>
              </a>
              <a class="nav-item" href="#/historico" data-route="historico">
                <span class="nav-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="8" /><path d="M12 8v4l3 2" /></svg></span>
                <span>Histórico</span>
              </a>
            </nav>

            <div class="sidebar-section">
              <div class="sidebar-section-header">
                <span>Meus treinos</span>
                <button id="new-workout-button" class="sidebar-add-button" type="button" data-action="new-workout" aria-label="Criar novo treino">＋</button>
              </div>
              <div id="sidebar-workouts" class="sidebar-workouts"></div>
            </div>

            <button id="sidebar-create-workout" class="new-list-button" type="button" data-action="new-workout">
              <span aria-hidden="true">＋</span>
              <span>Novo treino</span>
            </button>
          </div>

          <div class="sidebar-footer">
            <a class="nav-item nav-item-muted" href="#/configuracoes" data-route="configuracoes">
              <span class="nav-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" focusable="false"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" /><path d="m19 13 .1-1-.1-1 2-1.5-2-3.5-2.4 1a8 8 0 0 0-1.7-1L14.5 3h-5L9 6a8 8 0 0 0-1.7 1l-2.4-1-2 3.5L5 11a8 8 0 0 0 0 2l-2.1 1.5 2 3.5 2.4-1a8 8 0 0 0 1.7-1l.5 3h5l.5-3a8 8 0 0 0 1.7-1l2.4 1 2-3.5L19 13Z" /></svg></span>
              <span>Configurações</span>
            </a>
            <p class="storage-note">Seus dados ficam salvos neste navegador.</p>
          </div>
        </aside>

        <main id="main-content" class="main-content" tabindex="-1"></main>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
